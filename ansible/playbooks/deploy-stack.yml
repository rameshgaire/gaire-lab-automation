---
# deploy-stack.yml
# Installs Docker, configures 4GB Swap, and deploys the gaire.lab container stack behind a secure Caddy TLS proxy
# Run with: ansible-playbook playbooks/deploy-stack.yml -l azure_lab_vm

- name: Deploy gaire.lab Docker stack
  hosts: "{{ target | default('azure_lab_vm') }}"
  become: true
  gather_facts: true

  vars_files:
    - vars/secrets.yml  # <-- ADD THIS LINE HERE

  vars:
    docker_packages:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    stack_user: lab.admin
    ollama_model: phi3
    # CHANGE THIS to your exact registered DuckDNS subdomain prefix
    duckdns_prefix: "gairelab"

  tasks:

    # ── Pre-flight: Swap Space Configuration ────────────────────────
    - name: Check if swapfile already exists
      stat:
        path: /swapfile
      register: swapfile_check

    - name: Allocate memory space for swapfile
      command: fallocate -l 4G /swapfile
      when: not swapfile_check.stat.exists

    - name: Set secure permissions on swapfile
      file:
        path: /swapfile
        mode: '0600'
        owner: root
        group: root
      when: not swapfile_check.stat.exists

    - name: Format the swapfile system
      command: mkswap /swapfile
      when: not swapfile_check.stat.exists

    - name: Enable the swap file allocation live
      command: swapon /swapfile
      when: not swapfile_check.stat.exists
      register: swapon_result
      failed_when: 
        - swapon_result.rc != 0 
        - "'file already in use' not in swapon_result.stderr"

    - name: Ensure swapfile mounts persistently on reboot
      mount:
        name: none
        src: /swapfile
        fstype: swap
        opts: sw
        state: present

    # ── Docker Installation & Host Dependencies ──────────────────────
    - name: Install Docker and Python ecosystem dependencies
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - python3-docker
        state: present
        update_cache: yes

    - name: Create Docker GPG key directory
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Download Docker GPG key
      shell: |
        curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
      args:
        creates: /etc/apt/keyrings/docker.gpg

    - name: Add Docker repository
      shell: |
        echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null
      args:
        creates: /etc/apt/sources.list.d/docker.list

    - name: Install Docker engine
      apt:
        name: "{{ docker_packages }}"
        state: present
        update_cache: yes

    - name: Start and enable Docker service
      service:
        name: docker
        state: started
        enabled: yes

    - name: Add stack user to docker group
      user:
        name: "{{ stack_user }}"
        groups: docker
        append: yes

    # ── Firewall Web Configuration ──────────────────────────────────
    - name: Allow web traffic proxy ports through firewall
      ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop: ['80', '443']

    # ── Storage Layer: Docker Volumes ────────────────────────────────
    - name: Create Docker volumes
      community.docker.docker_volume:
        name: "{{ item }}"
        state: present
      loop:
        - portainer_data
        - n8n_data
        - ollama_data
        - open-webui_data
        - caddy_data
        - caddy_config

    - name: Create dedicated internal Docker network
      community.docker.docker_network:
        name: lab_secure_net
        state: present

    # ── Orchestration Layer: Container Deployments ───────────────────
    - name: Deploy Portainer
      community.docker.docker_container:
        name: portainer
        image: portainer/portainer-ce:latest
        state: started
        restart_policy: always
        networks:
          - name: lab_secure_net
        volumes:
          - /var/run/docker.sock:/var/run/docker.sock
          - portainer_data:/data

    - name: Deploy n8n
      community.docker.docker_container:
        name: n8n
        image: n8nio/n8n:latest
        state: started
        restart_policy: always
        networks:
          - name: lab_secure_net
        env:
          N8N_HOST: "n8n.{{ duckdns_prefix }}.duckdns.org"
          WEBHOOK_URL: "https://n8n.{{ duckdns_prefix }}.duckdns.org"
          GENERIC_TIMEZONE: "Australia/Sydney"
          TZ: "Australia/Sydney"
        volumes:
          - n8n_data:/home/node/.n8n

    - name: Deploy Ollama
      community.docker.docker_container:
        name: ollama
        image: ollama/ollama:latest
        state: started
        restart_policy: always
        networks:
          - name: lab_secure_net
        volumes:
          - ollama_data:/root/.ollama

    - name: Deploy Open WebUI
      community.docker.docker_container:
        name: open-webui
        image: ghcr.io/open-webui/open-webui:main
        state: started
        restart_policy: always
        networks:
          - name: lab_secure_net
        volumes:
          - open-webui_data:/app/backend/data
        env:
          OLLAMA_BASE_URL: "http://ollama:11434"
          HF_HUB_CACHE: "/app/backend/data/cache/hub"

    # ── Reverse Proxy Layer: DuckDNS & Caddy Configurations ──────────
    - name: Automatically update DuckDNS with the new Azure Public IP
      ansible.builtin.uri:
        url: "https://www.duckdns.org/update?domains={{ duckdns_prefix }}&token={{ vault_duckdns_token }}&ip={{ ansible_host }}"
        return_content: yes
      register: duckdns_update
      failed_when: "'OK' not in duckdns_update.content"

    - name: Ensure Caddy configuration directory exists
      ansible.builtin.file:
        path: /etc/caddy
        state: directory
        mode: '0755'

    - name: Generate Caddy Routing Layout (Caddyfile)
      ansible.builtin.copy:
        dest: /etc/caddy/Caddyfile
        mode: '0644'
        content: |
          n8n.{{ duckdns_prefix }}.duckdns.org {
              reverse_proxy n8n:5678
          }

          chat.{{ duckdns_prefix }}.duckdns.org {
              reverse_proxy open-webui:8080
          }

          portainer.{{ duckdns_prefix }}.duckdns.org {
              reverse_proxy portainer:9443 {
                  transport http {
                      tls_insecure_skip_verify
                  }
              }
          }

    - name: Deploy Caddy SSL Edge Routing Proxy
      community.docker.docker_container:
        name: caddy
        image: caddy:latest
        state: started
        restart_policy: always
        networks:
          - name: lab_secure_net
        ports:
          - "80:80"
          - "443:443"
        volumes:
          - /etc/caddy/Caddyfile:/etc/caddy/Caddyfile
          - caddy_data:/data
          - caddy_config:/config

    # ── Weights Layer: Model Verification ────────────────────────────
    - name: Wait for Ollama container initialization
      timeout: 10
      ansible.builtin.pause:
        seconds: 10

    - name: Pull model manifest into local volume space
      shell: docker exec ollama ollama pull {{ ollama_model }}
      register: model_pull
      changed_when: "'success' in model_pull.stdout"

    # ── Post-Deployment Validation ───────────────────────────────────
    - name: Verify run runtime state metrics
      shell: docker ps --format "{{ '{{' }}.Names{{ '}}' }}\t{{ '{{' }}.Status{{ '}}' }}"
      register: container_status
      changed_when: false

    - name: Print infrastructure endpoint layout
      debug:
        msg:
          - "====== Hardened Deployment Complete ======"
          - "{{ container_status.stdout_lines }}"
          - "=========================================="
          - "Portainer:   https://portainer.{{ duckdns_prefix }}.duckdns.org"
          - "n8n:         https://n8n.{{ duckdns_prefix }}.duckdns.org"
          - "Open WebUI:  https://chat.{{ duckdns_prefix }}.duckdns.org"